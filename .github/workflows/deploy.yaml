name: Euhedral Execution Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DEPLOY_ID }}
          private-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Cache macOS SDK
        id: cache-macos-sdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs/macos-sdk
          key: macos-sdk-26.1-v1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION }}

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            euhedral-hardware-utils/zig-cache
            euhedral-hardware-utils/zig-global-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('mise.toml', '**/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm xz-utils

      - name: Download macOS SDK headers for Zig
        if: ${{ !env.ACT && steps.cache-macos-sdk.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ~/.local/share/mise/installs/macos-sdk
          curl -f -L -s https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz | tar -xJ -C ~/.local/share/mise/installs/macos-sdk/

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install GPG Private Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Parse Version from gradle.properties
        id: check_version
        run: |
          VERSION=$(grep '^version =' build-logic/src/main/kotlin/buildlogic.java-conventions.gradle.kts | cut -d'=' -f2 | tr -d '"')
          echo "TARGET_TAG=v$VERSION" >> $GITHUB_OUTPUT
          
          if [[ "$VERSION" == *"-SNAPSHOT"* ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
            echo "Detected SNAPSHOT version: $VERSION. Will compile and verify, but SKIP deployment."
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
            echo "Detected RELEASE version: $VERSION. Validating deployment targets."
          fi

      - name: Check Existing Releases
        if: ${{ steps.check_version.outputs.is_snapshot == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_TAG: ${{ steps.check_version.outputs.TARGET_TAG }}
        run: |
          if gh release view "$TARGET_TAG" >/dev/null 2>&1 || git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "::error::Deployment aborted. A release or tag named $TARGET_TAG already exists."
            exit 1
          else
            echo "Version $TARGET_TAG is unique. Proceeding."
          fi

      - name: Build and Verify
        if: ${{ steps.check_version.outputs.is_snapshot == 'true' }}
        run: |
          mise exec -- gradle build integrationTest

      - name: Build and Deploy to Apache Maven Central
        if: ${{ steps.check_version.outputs.is_snapshot == 'false' }}
        run: |
          mise exec -- gradle integrationTest publish -Prelease -x test
        env:
          RELEASE_MODE: "true"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Git
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GIT_SIGNING_KEY }}" > ~/.ssh/id_signing
          chmod 600 ~/.ssh/id_signing
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/id_signing
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true

      - name: Create Git Tag and GitHub Release
        if: ${{ steps.check_version.outputs.is_snapshot == 'false' }}
        env:
          TARGET_TAG: ${{ steps.check_version.outputs.TARGET_TAG }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git tag -a "$TARGET_TAG" -m "Release $TARGET_TAG"
          git push origin "$TARGET_TAG"
          
          FILES=()
          for file in **/build/libs/*.jar; do
            if [[ ! "$file" == *"-sources.jar" ]] && [[ ! "$file" == *"-javadoc.jar" ]]; then
              FILES+=("$file")
            fi
          done
          
          gh release create "$TARGET_TAG" --generate-notes "${FILES[@]}"

      - name: Roll to Next Development Snapshot
        if: ${{ steps.check_version.outputs.is_snapshot == 'false' }}
        run: |
          CURRENT_VERSION=$(grep '^version =' build-logic/src/main/kotlin/buildlogic.java-conventions.gradle.kts | cut -d'=' -f2 | tr -d '"')
          
          BASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          
          # Increment patch version
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          PATCH=$((PATCH + 1))
          
          NEW_SNAPSHOT="$MAJOR.$MINOR.$PATCH-SNAPSHOT"
          
          sed -i "s/^version =.*/version = \"$NEW_SNAPSHOT\"/" build-logic/src/main/kotlin/buildlogic.java-conventions.gradle.kts
          
          git add gradle.properties
          git commit -m "actions: Bump version to $NEW_SNAPSHOT [skip ci]"
          git push origin main
