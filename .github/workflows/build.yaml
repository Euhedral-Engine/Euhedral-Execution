name: Euhedral Execution Build and Verify

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Cache macOS SDK
        id: cache-macos-sdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs/macos-sdk
          key: macos-sdk-26.1-v1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION }}

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            euhedral-hardware-utils/zig-cache
            euhedral-hardware-utils/zig-global-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('mise.toml', '**/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm xz-utils

      - name: Download macOS SDK
        if: steps.cache-macos-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.local/share/mise/installs/macos-sdk
          curl --fail --location --silent --show-error \
            https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz \
            | tar -xJ -C ~/.local/share/mise/installs/macos-sdk/

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Build and Verify
        run: |
          mise exec -- gradle build integrationTest --build-cache
