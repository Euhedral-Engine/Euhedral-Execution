name: Euhedral Execution Build and Verify

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Cache macOS SDK
        id: cache-macos-sdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs/macos-sdk
          key: macos-sdk-26.1-v1

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            euhedral-hardware-utils/target/zig-cache
            euhedral-hardware-utils/target/zig-global-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('mise.toml', '**/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Download macOS SDK
        if: steps.cache-macos-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          mkdir -p ~/.local/share/mise/installs/macos-sdk
          curl --fail --location --silent --show-error \
            https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz \
            | tar -xJ -C ~/.local/share/mise/installs/macos-sdk/

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Resolve Dependencies
        run: |
          mise exec -- mvn dependency:go-offline -B --file pom.xml

      - name: Build and Verify
        run: |
          mise exec -- mvn -B verify --file pom.xml
