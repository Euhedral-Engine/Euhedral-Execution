name: Agent optimizer verification

on:
  pull_request:
    branches:
      - ml-training

permissions:
  contents: read

jobs:
  trainer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Cache macOS SDK
        id: cache-macos-sdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs/macos-sdk
          key: macos-sdk-26.1-v1

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('mise.toml', '**/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Download macOS SDK headers for Zig
        if: ${{ !env.ACT && steps.cache-macos-sdk.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update && sudo apt-get install -y xz-utils
          mkdir -p ~/.local/share/mise/installs/macos-sdk
          curl -f -L -s https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz | tar -xJ --strip-components=1 -C ~/.local/share/mise/installs/macos-sdk/

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Fetch and Merge Multi-OS JNI Headers
        if: ${{ !env.ACT }}
        run: |
          MISE_JDK_PATH=$(mise where java)
          INCLUDE_DIR="$MISE_JDK_PATH/include"
          mkdir -p "$INCLUDE_DIR/darwin" "$INCLUDE_DIR/win32"
          cp "$INCLUDE_DIR/linux/jni_md.h" "$INCLUDE_DIR/darwin/jni_md.h"
          cp "$INCLUDE_DIR/linux/jni_md.h" "$INCLUDE_DIR/win32/jni_md.h"

      - name: Resolve Dependencies
        run: mise exec -- mvn dependency:go-offline -B --file pom.xml

      - name: Verify optimizer and trainer
        id: verify
        shell: bash
        run: |
          set +e
          {
            mise exec -- mvn -B -pl euhedral-training -am install -Dmaven.test.skip=true
            build_status=$?
            if [[ $build_status -eq 0 ]]; then
              mise exec -- mvn -B -pl euhedral-training test
              status=$?
            else
              status=$build_status
            fi
            if [[ $status -eq 0 ]]; then
              mise exec -- mvn -B -pl euhedral-training -am package -Dmaven.test.skip=true
              status=$?
            fi
          } >maven.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ $status -eq 0 ]]; then
            {
              echo 'Maven verification passed'
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
              echo "head_tree=$(git rev-parse '${{ github.event.pull_request.head.sha }}^{tree}')"
              echo "base_sha=${{ github.event.pull_request.base.sha }}"
              echo
              grep -R "Tests run:" euhedral-training/target/surefire-reports/*.txt || true
            } >maven-diagnostics.txt
          else
            {
              echo "Maven verification failed with status $status"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
              echo "head_tree=$(git rev-parse '${{ github.event.pull_request.head.sha }}^{tree}')"
              echo "base_sha=${{ github.event.pull_request.base.sha }}"
              grep -n -E -A10 -B5 '(COMPILATION ERROR|\[ERROR\]|Tests run:|Failures:|Errors:)' maven.log | tail -n 900
            } >maven-diagnostics.txt
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: optimizer-verification
          path: maven-diagnostics.txt

      - name: Fail when Maven failed
        if: steps.verify.outputs.status != '0'
        run: exit 1
