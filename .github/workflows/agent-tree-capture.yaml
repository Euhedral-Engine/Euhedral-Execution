name: Agent patch application

on:
  pull_request:
    branches:
      - ml-training

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply pending edit
        shell: bash
        run: |
          if [[ -f .agent/apply.py ]]; then
            python3 .agent/apply.py
            rm .agent/apply.py
          elif [[ -f .agent/pending.patch ]]; then
            git apply --check .agent/pending.patch
            git apply .agent/pending.patch
            rm .agent/pending.patch
          else
            echo 'No pending edit.'
            exit 0
          fi
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply agent implementation patch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
