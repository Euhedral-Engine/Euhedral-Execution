name: Agent patch application

on:
  pull_request:
    branches:
      - ml-training

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply pending patch
        shell: bash
        run: |
          if [[ ! -f .agent/pending.patch ]]; then
            echo 'No pending patch.'
            exit 0
          fi
          git apply --check .agent/pending.patch
          git apply --index .agent/pending.patch
          git rm .agent/pending.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply agent implementation patch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
