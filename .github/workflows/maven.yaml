name: Java CI with Maven (Linux-Only Cross-Compile)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS SDK headers for Zig
        run: |
          mkdir -p $HOME/.local/share/mise/installs/macos-sdk
          curl -L https://github.com \
          
            | tar -xJ --strip-components=1 -C $HOME/.local/share/mise/installs/macos-sdk/

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Fetch and Merge Multi-OS JNI Headers
        run: |
          MISE_JDK_PATH=$(mise where java)
          INCLUDE_DIR="$MISE_JDK_PATH/include"
          mkdir -p "$INCLUDE_DIR"
          
          echo "Target include directory located at: $INCLUDE_DIR"
          
          curl -L -s https://github.com | tar -xzf - \
            --strip-components=5 -C "$INCLUDE_DIR" \
            "jdk-jdk-25-ga/src/java.base/macosx/native/include/bridge" \
            "jdk-jdk-25-ga/src/java.base/unix/native/include/jni_md.h"
          mkdir -p "$INCLUDE_DIR/darwin"
          mv "$INCLUDE_DIR/jni_md.h" "$INCLUDE_DIR/darwin/jni_md.h"
          
          # Fetch and unpack Windows-specific JNI headers (win32/)
          curl -L -s https://github.com | tar -xzf - \
            --strip-components=5 -C "$INCLUDE_DIR" \
            "jdk-jdk-25-ga/src/java.base/windows/native/include/jni_md.h"
          mkdir -p "$INCLUDE_DIR/win32"
          mv "$INCLUDE_DIR/jni_md.h" "$INCLUDE_DIR/win32/jni_md.h"
          
          # Output the structural layout to your Action logs for instant validation
          echo "Final JNI Include Directory Layout:"
          ls -R "$INCLUDE_DIR"

      - name: Build with Maven
        run: |
          mise exec -- mvn -B package --file pom.xml

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
