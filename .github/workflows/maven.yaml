name: Euhedral Execution Compile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache macOS SDK Headers
        id: cache-macos-sdk
        uses: actions/cache@v4
        with:
          path: $HOME/.local/share/mise/installs/macos-sdk
          key: macos-sdk-13.3-v1

      - name: Download macOS SDK headers for Zig
        if: steps.cache-macos-sdk.outputs.cache-hit != 'true' && !env.ACT
        run: |
          mkdir -p $HOME/.local/share/mise/installs/macos-sdk
          curl -f -L https://github.com | tar -xJ --strip-components=1 -C $HOME/.local/share/mise/installs/macos-sdk/

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Fetch and Merge Multi-OS JNI Headers
        if: ${{ !env.ACT }}
        run: |
          MISE_JDK_PATH=$(mise where java)
          INCLUDE_DIR="$MISE_JDK_PATH/include"
          mkdir -p "$INCLUDE_DIR"
          
          echo "Target include directory located at: $INCLUDE_DIR"
          
          echo "Processing macOS (darwin) native parameters..."
          mkdir -p "$INCLUDE_DIR/darwin"
          curl -f -L -s https://githubusercontent.com -o "$INCLUDE_DIR/darwin/jni_md.h"
          
          echo "Processing Windows (win32) native parameters..."
          mkdir -p "$INCLUDE_DIR/win32"
          curl -f -L -s https://githubusercontent.com -o "$INCLUDE_DIR/win32/jni_md.h"
          
          echo "Final JNI Include Directory Layout:"
          ls -R "$INCLUDE_DIR"

      - name: Build with Maven
        run: |
          mise exec -- mvn -B package --file pom.xml

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
