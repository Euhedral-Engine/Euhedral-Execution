[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pareto-weight-calibration"
version = "0.1.0"
description = "External Python loader and Pareto-weight calibration trainer for Euhedral Execution"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Euhedral Execution Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
tournament = [
    "scikit-learn==1.7.2",
    "torch>=2.6,<3"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov"
]

[project.scripts]
pareto-calibration = "pareto_weight_calibration.cli:main"
pareto-participation-pipeline = "pareto_weight_calibration.pipeline:main"
pareto-participation-peak-pipeline = "pareto_weight_calibration.peak_pipeline:main"
pareto-participation-side-evaluation = "pareto_weight_calibration.side_of_peak:main"
pareto-participation-action-pipeline = "pareto_weight_calibration.action_pipeline:main"
pareto-participation-integer-cutoff-evaluation = "pareto_weight_calibration.integer_cutoff:main"
pareto-model-tournament = "pareto_weight_calibration.model_tournament:main"

[tool.setuptools.package-data]
pareto_weight_calibration = ["tournament_grid.json", "tournament_inputs.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
